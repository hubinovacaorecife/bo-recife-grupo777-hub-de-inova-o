<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f0fb">
  <meta name="description" content="Entre no REC SCIENCE para acompanhar pesquisas e projetos de Recife.">
  <title>Entrar · REC SCIENCE</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth">
  <main class="cartao cartao-login">
    <a class="voltar-inicio" href="../index.html">← <span>Voltar ao início</span></a>

    <header class="auth-cabecalho">
      <a class="logo-auth" href="../index.html" aria-label="REC SCIENCE, página inicial">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M8 9.5 16 16l8-6.5M9 23l7-7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="8" cy="8" r="3" fill="currentColor"/>
          <circle cx="24" cy="8" r="3" fill="currentColor"/>
          <circle cx="16" cy="16" r="3.5" fill="#ffc83d"/>
          <circle cx="8" cy="24" r="3" fill="currentColor"/>
          <circle cx="24" cy="24" r="3" fill="currentColor"/>
        </svg>
      </a>
      <h1>REC SCIENCE</h1>
      <p class="sub">Acesse sua conta para continuar</p>
    </header>

    <form id="form-login" novalidate>
      <div class="campo">
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="email" placeholder="seuemail@exemplo.com" required>
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <div class="campo-senha">
          <input id="senha" type="password" autocomplete="current-password" placeholder="Digite sua senha" required>
          <button class="alternar-senha" type="button" data-alternar-senha="senha" aria-label="Mostrar senha" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" stroke-width="1.7"/>
              <circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.7"/>
              <path class="risco-olho" d="m4 4 16 16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>

      <p id="erro" class="erro" role="alert" aria-live="polite" hidden></p>
      <button type="submit" class="botao">Entrar</button>
    </form>

    <p class="rodape">Ainda não possui conta? <a href="create_account.html">Crie agora</a></p>
  </main>

  <script type="module" src="../js/pages/login.js"></script>
</body>
</html>
